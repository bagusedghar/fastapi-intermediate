# Secret: nilai rahasia, akses bisa dibatasi dengan RBAC Kubernetes.
# File ini hanya CONTOH untuk latihan dan tidak boleh berisi nilai asli.
# Di production, Secret dibuat dari luar repository, misalnya:
#   kubectl create secret generic order-api-secret --from-literal=API_KEY=...
# Catatan: isi Secret hanya di-encode base64, bukan dienkripsi.
apiVersion: v1
kind: Secret
metadata:
  name: order-api-secret
type: Opaque
stringData:
  API_KEY: "ganti-di-cluster-asli"
