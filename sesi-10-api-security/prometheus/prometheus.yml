# Prometheus mengambil (scrape) /metrics setiap 5 detik dari API dan consumer yang jalan di laptop.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: order-api
    static_configs:
      - targets: ["host.docker.internal:8000"]   # uvicorn

  - job_name: notification-consumer
    static_configs:
      - targets: ["host.docker.internal:8001"]   # start_http_server di consumer
